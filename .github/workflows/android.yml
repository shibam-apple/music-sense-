name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK (with YouTube Music)
        run: flutter build apk --release
      - name: Build release APK (Play Store flavour, no YouTube Music)
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk music-sense.apk
          flutter build apk --release --dart-define=YT_MUSIC=false
          cp build/app/outputs/flutter-apk/app-release.apk music-sense-no-youtube.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: "*.apk"

      - id: tag
        run: echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Publish test release
        # Needs "Read and write" workflow permissions in the repo settings;
        # the APKs are always available as the run's "apks" artifact too.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Music Sense test build ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Test build from ${{ github.sha }}. Install `music-sense.apk` on an
            Android 7+ phone (allow installs from your browser when asked).
            `music-sense-no-youtube.apk` is the Play Store flavour without
            YouTube Music. Signed with a debug key: for testing only.
          files: "*.apk"

  youtube-live:
    name: YouTube Music live check
    runs-on: ubuntu-latest
    # Informational: YouTube often refuses CI runners' data-centre IPs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test_live --reporter expanded

  device-test:
    name: Emulator test (playback, Beat Sense, screenshots)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter pub get
      - name: Make test songs
        run: ./tool/make_test_songs.sh build/test_songs
      - name: Build test app
        run: flutter build apk --debug --target=integration_test/device_test.dart

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          ram-size: 4096M
          heap-size: 576M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          script: ./tool/run_device_test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test
          path: |
            build/screenshots
            build/device-test.log
      - name: Attach screenshots to the test release
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: build/screenshots/*.png
